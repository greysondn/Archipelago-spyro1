    -
        # game state
        name: gamestate
        readonly: true
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x757d8
                format: int
                length: 1
                byte_order: little
                guards:
                    read:
                        type: always
                    write:
                        type: never
                values:
                    "balloonist":       0x0C
                    "credits":          0x0F
                    "cutscene":         0x0E
                    "death":            0x04
                    "dragon cutscene":  0x08
                    "exiting level":    0x0B
                    "flight menu":      0x07
                    "fly in":           0x09
                    "game over":        0x05
                    "gameplay":         0x00
                    "inventory":        0x03
                    "loading":          0x01
                    "paused":           0x02
                    "title screen":     0x0D
    -
        # Last return vortex we touched - lot of level exits
        # it IS a pointer, but we don't care.
        name: last_touched_whirlwind
        readonly: true
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x78C7C
                format: int
