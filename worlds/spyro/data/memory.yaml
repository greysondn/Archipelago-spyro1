    -
        # game state
        name: gamestate
        readonly: true
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x757d8
                format: int
                length: 1
                byte_order: little
                guards:
                    read:
                        type: always
                    write:
                        type: never
                values:
                    "balloonist":       0x0C
