    -
        # environment id
        name: env_id
        readonly: true
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x7596c
                format: int
                length: 1
                byte_order: little
                guards:
                    read:
                        type: always
                    write:
                        type: never
                values:
                    "Alpine Ridge":     31
                    "Artisans":         10
                    "Beast Makers":     40
                    "Blowhard":         34
                    "Cliff Town":       22
                    "Crystal Flight":   35
                    "Dark Hollow":      12
