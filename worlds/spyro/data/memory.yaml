    # -------------------------------------------------------------------------
    # BALLOONS
    # -------------------------------------------------------------------------

    # artisans
    -
        name: Artisans balloon 1
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x7bc04
                format: bytes
                length: 1
                byte_order: little
                guard:
                    read:
                        type: memory_equals
                        params:
                            name:  gamestate
                            value: balloonist
                    write:
                        type: memory_equals
                        params:
                            name:  gamestate
                            value: balloonist
    -
        name: Artisans balloon 2
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x7bc08
                format: bytes
                length: 2
                byte_order: little
                guard:
                    read:
                        type: memory_equals
                        params:
                            name:  gamestate
                            value: balloonist
                    write:
                        type: memory_equals
                        params:
                            name:  gamestate
                            value: balloonist
    

