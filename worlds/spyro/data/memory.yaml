    # -------------------------------------------------------------------------
    # DRAGONS
    # -------------------------------------------------------------------------

    -
        name: Artisans - Nestor
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x77913
                format: flag
                length: 1
                byte_order: little
                guards:
                    read:
                        type: always
                    write:
                        type: never
                values:
                    default: False
                    0x01:    True

    # -------------------------------------------------------------------------
    # GEM COUNTERS
    # -------------------------------------------------------------------------

    -
        name: Artisans gem counter
        default: usa
        aliases: []
        versions:
            usa:
                domain: MainRAM
                address: 0x77420
                format: int
                length: 2
                byte_order: little
                guards:
                    read:
                        type: always
                    write:
                        type: never
                values: []

